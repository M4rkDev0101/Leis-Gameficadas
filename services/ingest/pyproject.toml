[project]
name = "vade-ingest"
version = "0.1.0"
description = "Importa o acervo ctresb/leis (Markdown + YAML) para o catálogo do Vade"
requires-python = ">=3.11"
dependencies = []  # só biblioteca padrão: o importador roda em qualquer máquina com Python e git

[project.scripts]
vade-ingest = "vade_ingest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vade_ingest = ["schema.sql", "web/index.html"]
