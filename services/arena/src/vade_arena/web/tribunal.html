<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vade Tribunal</title>
<style>
  :root {
    --bg:#0B0D12; --panel:#141821; --panel-2:#1C2230; --line:#2A3242; --text:#EEF1F6; --muted:#A3ADBD;
    --gold:#F5B700; --red:#E5483B; --blue:#4F7BFF; --green:#2FBF71; --purple:#A57BFF;
    --wood-1:#5A3A22; --wood-2:#7A5232; --wood-3:#3E2716;
    --mono:ui-monospace,"JetBrains Mono",Consolas,monospace;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button { font:inherit; color:inherit; cursor:pointer; }
  button:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .hidden { display:none !important; }
  .wrap { max-width:1180px; margin:0 auto; padding:14px 16px 40px; }

  /* ------------------------------------------------------------ menu */
  .iconbtn { border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:7px 12px; font-weight:700; }
  .chip { display:inline-block; font-size:.75rem; font-weight:800; padding:2px 9px; border-radius:99px; background:var(--panel-2); color:var(--muted); }
  .chip.advogado { background:rgba(79,123,255,.18); color:#9db4ff; } .chip.promotor { background:rgba(229,72,59,.18); color:#ff9a90; }
  .chip.juiz { background:rgba(165,123,255,.18); color:#cbb3ff; }
  .chip.investigado { background:rgba(160,160,170,.18); color:#d6d8de; }
  .best { color:var(--gold); font-weight:800; font-size:.85rem; }

  /* ------------------------------------------------------------ palco */
  #game { position:fixed; inset:0; background:#000; z-index:50; display:flex; align-items:center; justify-content:center; }
  .stage-wrap { width:min(100vw, calc(100vh * 16 / 10)); aspect-ratio:16 / 10; position:relative; container-type:inline-size; }
  .stage { position:absolute; inset:0; overflow:hidden; background:#111; user-select:none; }
  .stage.shake { animation:shake .45s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake { 10%,90%{transform:translate(-2px,1px)} 20%,80%{transform:translate(5px,-2px)} 30%,50%,70%{transform:translate(-9px,3px)} 40%,60%{transform:translate(9px,-3px)} }
  .scene { position:absolute; inset:0; transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s; }
  .scene.enter-l { transform:translateX(-30%); opacity:0; } .scene.enter-r { transform:translateX(30%); opacity:0; }
  .bg { position:absolute; inset:0; }
  .bg .bgimg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; user-select:none; }
  .actor { position:absolute; left:50%; bottom:26%; width:38%; transform:translateX(-50%); transition:transform .25s; }
  .actor svg { width:100%; height:auto; display:block; overflow:visible; }
  .actor.idle svg { animation:bob 3.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-1.2%); } }
  .actor.slam { animation:slam .35s ease; } @keyframes slam { 30% { transform:translateX(-50%) translateY(6%); } }
  .actor.shock svg { animation:jolt .4s ease; } @keyframes jolt { 20% { transform:translateX(-3%) rotate(-2deg);} 40% { transform:translateX(3%) rotate(2deg);} 60%{transform:translateX(-2%);} }
  .desk { position:absolute; left:0; right:0; bottom:23%; height:19%; }
  .floor { position:absolute; left:0; right:0; bottom:0; height:24%; background:linear-gradient(#2a1a10,#120b06); }
  .plaque { position:absolute; bottom:30%; left:50%; transform:translateX(-50%); font-family:Georgia,serif; font-weight:700;
            letter-spacing:.2em; font-size:1.6cqw; color:#f7e3b0; background:linear-gradient(#6b4a2a,#4a2f19); padding:.3cqw 1.4cqw;
            border:.25cqw solid #c9a04a; border-radius:.4cqw; text-transform:uppercase; }
  /* boca falando / piscar */
  .talking .m-open { animation:mouth .18s steps(1) infinite; }
  .talking .m-closed { animation:mouth .18s steps(1) infinite reverse; }
  @keyframes mouth { 0% { opacity:1; } 50% { opacity:0; } }
  .m-open { opacity:0; }
  .eyes { transform-box:fill-box; transform-origin:center; animation:blink 4.6s infinite; }
  @keyframes blink { 0%,94%,100% { transform:scaleY(1); } 96% { transform:scaleY(.08); } }
  .sweat { animation:drip 1.4s ease-in infinite; } @keyframes drip { 0% { transform:translateY(0); opacity:1;} 100% { transform:translateY(14px); opacity:0;} }

  /* ------------------------------------------------------------ HUD */
  .hud { position:absolute; top:2%; left:2%; right:2%; display:flex; align-items:flex-start; gap:1cqw; z-index:5; pointer-events:none; }
  .hud > * { pointer-events:auto; }
  .hudbtn { border:.2cqw solid #c9a04a; background:linear-gradient(#3a2716,#24170c); color:#f7e3b0; border-radius:.8cqw;
            padding:.6cqw 1.2cqw; font-weight:800; font-size:1.4cqw; box-shadow:0 .3cqw 0 #120b05; }
  .hudbtn:active { transform:translateY(.2cqw); box-shadow:none; }
  .cred { margin-left:auto; display:flex; gap:.4cqw; background:rgba(0,0,0,.55); padding:.6cqw 1cqw; border-radius:99px; align-items:center; }
  .cred small { font-size:1.1cqw; font-weight:800; color:#f7e3b0; margin-right:.4cqw; letter-spacing:.06em; }
  .cred i { width:2.2cqw; height:2.2cqw; display:grid; place-items:center; font-style:normal; font-size:1.7cqw; transition:all .3s; }
  .cred i.lost { filter:grayscale(1) brightness(.4); transform:scale(.8); }
  .cred i.break { animation:break .6s ease; } @keyframes break { 30% { transform:scale(1.6) rotate(-20deg); filter:hue-rotate(-40deg) saturate(3); } }

  /* ------------------------------------------------------------ caixa de diálogo */
  .dialog { position:absolute; left:2%; right:2%; bottom:2.5%; height:25%; z-index:6;
            background:linear-gradient(180deg, rgba(14,18,30,.94), rgba(8,10,18,.96)); border:.3cqw solid #d9d2c0;
            border-radius:1.2cqw; box-shadow:0 0 0 .3cqw #1a1f2e, 0 1.2cqw 2cqw rgba(0,0,0,.5); padding:2.2cqw 2.4cqw 1.6cqw; cursor:pointer; }
  .nameplate { position:absolute; top:-2.4cqw; left:2cqw; font-weight:900; font-size:1.7cqw; letter-spacing:.02em;
               padding:.3cqw 1.4cqw; border-radius:.6cqw .6cqw 0 0; background:#d9d2c0; color:#141821; }
  .nameplate.np-defesa { background:#9db4ff; } .nameplate.np-acusacao { background:#ff9a90; } .nameplate.np-juiz { background:#cbb3ff; }
  .nameplate.np-testemunha { background:#ffe08a; } .nameplate.np-escritorio { background:#a8e6c4; }
  .text { font-size:2.15cqw; line-height:1.45; white-space:pre-wrap; min-height:5.6cqw; }
  .text.thought { color:#8fb6ff; } .text.statement { color:#7CF29A; } .text.narr { color:#d9c9a8; font-style:italic; }
  .next { position:absolute; right:2cqw; bottom:1.2cqw; font-size:1.8cqw; color:var(--gold); animation:nudge .8s infinite; }
  @keyframes nudge { 50% { transform:translateY(.4cqw); } }

  /* ------------------------------------------------------------ interrogatório e escolhas */
  .xbar { position:absolute; left:2%; right:2%; bottom:29.5%; z-index:7; display:flex; gap:1cqw; align-items:center; justify-content:center; }
  .xbtn { font-weight:900; font-size:1.7cqw; padding:.9cqw 2cqw; border-radius:1cqw; border:.3cqw solid #fff; box-shadow:0 .4cqw 0 rgba(0,0,0,.5);
          text-transform:uppercase; letter-spacing:.03em; }
  .xbtn:active { transform:translateY(.3cqw); box-shadow:none; }
  .x-press { background:#2e6ae6; } .x-present { background:#c43328; } .x-nav { background:#30384a; min-width:5cqw; }
  .x-defer { background:#1f8f55; } .x-indef { background:#a32b22; }
  .banner { position:absolute; top:12%; left:0; right:0; z-index:8; text-align:center; pointer-events:none; }
  .banner span { display:inline-block; font-family:Georgia,serif; font-weight:900; font-size:3.4cqw; letter-spacing:.12em; text-transform:uppercase;
                 color:#fff; padding:.6cqw 4cqw; background:linear-gradient(90deg, transparent, rgba(180,20,20,.9) 15%, rgba(180,20,20,.9) 85%, transparent);
                 animation:slidein .5s cubic-bezier(.2,.8,.2,1) both; }
  .banner.green span { background:linear-gradient(90deg, transparent, rgba(20,130,70,.9) 15%, rgba(20,130,70,.9) 85%, transparent); }
  .banner small { display:block; font-size:1.7cqw; color:#ffe08a; margin-top:.6cqw; animation:slidein .5s .1s both; }
  @keyframes slidein { from { transform:translateX(-40%); opacity:0; } }
  .menu { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); width:min(78%, 80cqw); z-index:9; display:grid; gap:1cqw; }
  .menu .q { text-align:center; font-weight:900; font-size:2cqw; text-shadow:0 .2cqw .4cqw #000; margin-bottom:.4cqw; }
  .opt { text-align:left; font-size:1.8cqw; padding:1.2cqw 1.6cqw; border-radius:1cqw; border:.25cqw solid #d9d2c0;
         background:linear-gradient(#232b3d,#171d2a); display:flex; gap:1.2cqw; align-items:flex-start; animation:pop .25s both; }
  .opt:hover { border-color:var(--gold); background:linear-gradient(#2c3650,#1c2333); }
  .opt b { flex:none; width:3cqw; height:3cqw; border-radius:.7cqw; background:#d9d2c0; color:#141821; display:grid; place-items:center; }
  @keyframes pop { from { transform:scale(.92); opacity:0; } }

  /* ------------------------------------------------------------ efeitos */
  .fx { position:absolute; inset:0; z-index:20; pointer-events:none; }
  .flash { position:absolute; inset:0; background:#fff; animation:flash .35s ease-out forwards; }
  @keyframes flash { from { opacity:.95; } to { opacity:0; } }
  .bubble { position:absolute; left:50%; top:42%; width:62%; transform:translate(-50%,-50%) rotate(-6deg); animation:bubble .9s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes bubble { 0% { transform:translate(-50%,-50%) rotate(-6deg) scale(.2); } 18% { transform:translate(-50%,-50%) rotate(-6deg) scale(1.08);} 30%,100% { transform:translate(-50%,-50%) rotate(-6deg) scale(1);} }
  .gavel { position:absolute; right:12%; top:16%; width:22%; transform-origin:80% 80%; animation:gavel .9s ease-in-out both; }
  @keyframes gavel { 0%{transform:rotate(-50deg)} 15%{transform:rotate(10deg)} 33%{transform:rotate(-40deg)} 48%{transform:rotate(10deg)} 66%{transform:rotate(-40deg)} 80%,100%{transform:rotate(10deg)} }
  .card-fly { position:absolute; left:50%; top:40%; width:30%; transform:translate(-50%,-50%); animation:fly .7s cubic-bezier(.2,1.2,.4,1) both;
              background:#f4ecd8; color:#2a1c12; border-radius:1cqw; padding:1.4cqw; border:.4cqw solid #c9a04a; box-shadow:0 1cqw 3cqw rgba(0,0,0,.6); }
  .card-fly .ic { font-size:5cqw; text-align:center; } .card-fly b { display:block; text-align:center; font-size:1.7cqw; }
  @keyframes fly { from { transform:translate(60%, 80%) scale(.3) rotate(20deg); opacity:0; } }
  .redflash { position:absolute; inset:0; background:radial-gradient(circle, transparent 40%, rgba(220,30,30,.65)); animation:flash .6s ease-out forwards; }
  /* "juice": só transform/opacity, animações finitas; desligado por prefers-reduced-motion e pela opção "Efeitos de tela" */
  .bubble.punch { animation:bubblepunch .55s cubic-bezier(.2,1.4,.3,1) both; }
  @keyframes bubblepunch { 0% { transform:translate(-50%,-50%) rotate(-6deg) scale(3.4); opacity:0; } 35% { transform:translate(-50%,-50%) rotate(-6deg) scale(.88); opacity:1; }
    55% { transform:translate(-50%,-50%) rotate(-6deg) scale(1.1); } 100% { transform:translate(-50%,-50%) rotate(-6deg) scale(1); } }
  .whiteflash { position:absolute; inset:0; background:#fff; animation:flash .18s ease-out forwards; }
  .stage.hitstop, .stage.hitstop * { animation-play-state:paused !important; }
  .stage.shake.lite { animation:shakelite .28s ease-out; }
  @keyframes shakelite { 20% { transform:translate(-3px,1px); } 40% { transform:translate(3px,-1px); } 60% { transform:translate(-2px,0); } 80% { transform:translate(1px,0); } }
  .actor.zoomface { transform:translateX(-50%) scale(1.55); transform-origin:50% 22%; transition:transform .12s ease-out; }
  .speed { position:absolute; inset:-25% -25% 32% -25%; pointer-events:none; animation:speedln .75s ease-out forwards;
           background:repeating-conic-gradient(from 3deg at 50% 45%, rgba(255,255,255,.92) 0 .7deg, transparent .7deg 4.6deg);
           -webkit-mask-image:radial-gradient(circle at 50% 45%, transparent 16%, #000 62%); mask-image:radial-gradient(circle at 50% 45%, transparent 16%, #000 62%); }
  .speed.b { background:repeating-conic-gradient(from 0deg at 50% 45%, rgba(255,210,94,.85) 0 .4deg, transparent .4deg 3.1deg); animation-duration:.9s; }
  @keyframes speedln { 0% { opacity:0; transform:scale(1.7); } 18% { opacity:1; } 100% { opacity:0; transform:scale(1); } }
  .cred.hurt { animation:credhurt .8s ease-out; }
  @keyframes credhurt { 0%,100% { background:rgba(11,13,17,.8); transform:none; } 12% { background:rgba(200,30,30,.9); transform:translateX(-4px); } 28% { transform:translateX(4px); } 40% { background:rgba(200,30,30,.8); transform:translateX(-2px); }
    55% { background:rgba(130,20,20,.7); transform:none; } 75% { background:rgba(200,30,30,.6); } }
  .cred i { position:relative; }
  .cred i.break::after { content:""; position:absolute; left:50%; top:60%; width:.55cqw; height:.8cqw; margin-left:-.28cqw; border-radius:50% 50% 50% 50% / 30% 30% 70% 70%;
                         background:#d11; animation:bleed 1s ease-in forwards; }
  @keyframes bleed { 0% { transform:translateY(0) scale(.4); opacity:1; } 100% { transform:translateY(5cqw) scale(1.1,1.8); opacity:0; } }
  .wipe { position:absolute; inset:0; z-index:40; pointer-events:none; transform:translateX(-101%); animation:wipein .24s ease-in forwards;
          background:linear-gradient(90deg, #0b0d11 0 96%, #D4A24C 96% 98.5%, #0b0d11 98.5%); }
  .wipe.out { animation:wipeout .3s ease-out forwards; background:linear-gradient(90deg, #0b0d11 0 1.5%, #D4A24C 1.5% 4%, #0b0d11 4%); }
  @keyframes wipein { to { transform:translateX(0); } } @keyframes wipeout { from { transform:translateX(0); } to { transform:translateX(101%); } }
  .stamp.letters { animation:none; }
  .stamp .lt { display:inline-block; animation:ltslam .32s cubic-bezier(.2,1.6,.4,1) both; animation-delay:var(--d); }
  @keyframes ltslam { from { transform:scale(3.4) translateY(-35%); opacity:0; } }
  .tx-k { color:#ffd25e; font-weight:800; } .tx-k.cap { color:#ff8a78; } .tx-k.num { color:#8fd8ff; }
  .confetti.paper { width:2cqw; height:2.6cqw; background:#f4ecd8 !important; box-shadow:inset 0 0 0 1px #c9a04a; }

  /* ------------------------------------------------------------ autos (provas) */
  .modal { position:absolute; inset:4%; z-index:30; background:linear-gradient(#f4ecd8,#e8dcbf); color:#2a1c12; border-radius:1.6cqw;
           border:.5cqw solid #8a5a2b; box-shadow:0 2cqw 5cqw rgba(0,0,0,.6); display:grid; grid-template-rows:auto 1fr auto; overflow:hidden; }
  .modal header { display:flex; align-items:center; gap:1cqw; padding:1.4cqw 2cqw; background:#8a5a2b; color:#fff4d6; }
  .modal header h2 { margin:0; font-family:Georgia,serif; font-size:2.2cqw; }
  .modal header .sp { flex:1; }
  .modal .x { background:none; border:0; color:#fff4d6; font-size:2.6cqw; line-height:1; }
  .tabs2 button { border:0; background:rgba(255,255,255,.15); color:#fff4d6; border-radius:.6cqw; padding:.4cqw 1.2cqw; font-size:1.4cqw; font-weight:800; margin-left:.4cqw; }
  .tabs2 button[aria-pressed="true"] { background:#fff4d6; color:#5a3a1c; }
  .mbody { display:grid; grid-template-columns:1.1fr 1fr; gap:1.6cqw; padding:1.6cqw 2cqw; overflow:auto; }
  .grid-ev { display:grid; grid-template-columns:repeat(auto-fill, minmax(11cqw, 1fr)); gap:1cqw; align-content:start; }
  .ev { border:.3cqw solid #c9a04a; background:#fffaf0; border-radius:1cqw; padding:1cqw; text-align:center; font-size:1.25cqw; font-weight:700; color:#2a1c12; }
  .ev .ic { font-size:3.6cqw; display:block; }
  .ev[aria-pressed="true"] { border-color:#d23a2f; box-shadow:0 0 0 .3cqw #d23a2f; background:#fff1e6; }
  .detail { background:#fffaf0; border:.3cqw dashed #c9a04a; border-radius:1cqw; padding:1.4cqw; font-size:1.45cqw; }
  .detail h3 { margin:0 0 .6cqw; font-size:1.8cqw; } .detail .law { font-family:Georgia,serif; font-size:1.55cqw; line-height:1.55; }
  .detail .ref { font-family:var(--mono); font-size:1.1cqw; color:#8a5a2b; }
  .mbody.cast { grid-template-columns:1fr; } .mbody.cast .detail { display:none; }
  .mbody.cast .grid-ev { grid-template-columns:repeat(auto-fill, minmax(min(100%, max(34cqw, 260px)), 1fr)); gap:1.2cqw; align-items:start; }
  .castcard { display:flex; gap:1.2cqw; align-items:flex-start; background:#fffaf0; border:.25cqw solid #c9a04a; border-radius:1cqw; padding:1cqw; color:#2a1c12; min-width:0; }
  .castcard .pt { flex:none; width:max(48px, 8cqw); aspect-ratio:3/4; overflow:hidden; border-radius:.8cqw; background:linear-gradient(#e8dcbf,#cdb98d); }
  .castcard .pt svg { width:100%; height:100%; display:block; }
  .castcard .tx { min-width:0; font-size:max(11px, 1.35cqw); line-height:1.4; overflow-wrap:anywhere; }
  .castcard .tx b { font-family:Georgia,serif; font-size:max(13px, 1.7cqw); }
  .castcard .tx .role { color:#8a5a2b; font-weight:800; text-transform:uppercase; font-size:max(10px, 1.05cqw); letter-spacing:.05em; margin-bottom:.3cqw; }
  .castcard .tx p { margin:.4cqw 0 0; } .castcard .tx .mot { color:#5a3a1c; font-style:italic; }
  .modal footer { padding:1.2cqw 2cqw; display:flex; gap:1cqw; justify-content:flex-end; background:#e2d3b0; }
  .modal footer .hint { margin-right:auto; font-size:1.3cqw; color:#5a3a1c; align-self:center; }
  .pbtn { font-weight:900; font-size:1.6cqw; padding:.8cqw 2cqw; border-radius:.9cqw; border:0; background:#d23a2f; color:#fff; box-shadow:0 .35cqw 0 #7a1d16; }
  .pbtn:disabled { opacity:.4; cursor:not-allowed; } .pbtn.sec { background:#8a5a2b; box-shadow:0 .35cqw 0 #4a2f19; }

  /* ------------------------------------------------------------ telas cheias */
  .full { position:absolute; inset:0; z-index:25; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:4cqw; }
  .titlecard { background:radial-gradient(circle at 50% 40%, #3a2614, #0b0806 70%); }
  .titlecard .ep { all:unset; font-family:Georgia,serif; color:#c9a04a; letter-spacing:.4em; font-size:2cqw; text-transform:uppercase; animation:slidein .6s both; }
  .titlecard h1 { font-family:Georgia,serif; font-size:6cqw; margin:.6cqw 0 0; color:#fff4d6; text-shadow:0 .4cqw 0 #6b3d10; animation:pop .7s .15s both; }
  .titlecard p { color:#d9c9a8; max-width:60ch; font-size:1.6cqw; animation:slidein .6s .3s both; }
  .verdict { background:radial-gradient(circle at 50% 35%, rgba(60,40,20,.92), rgba(5,4,3,.97) 70%); }
  .stamp { font-family:Georgia,serif; font-weight:900; font-size:6cqw; letter-spacing:.06em; padding:.6cqw 3cqw; border:.8cqw solid currentColor;
           border-radius:1.4cqw; transform:rotate(-7deg); animation:stampin .55s cubic-bezier(.2,1.6,.4,1) both; text-transform:uppercase;
           max-width:88%; white-space:nowrap; background:rgba(0,0,0,.35); text-shadow:0 0 1.4cqw currentColor; position:relative; z-index:2; }
  .stamp.ok { color:#3ddc84; } .stamp.no { color:#ff5a4c; } .stamp.mid { color:var(--gold); }
  @keyframes stampin { from { transform:rotate(-7deg) scale(3); opacity:0; } }
  .verdict h2 { font-family:Georgia,serif; font-size:3.2cqw; margin:2.4cqw 0 .6cqw; color:#fff4d6; }
  .verdict p { max-width:62ch; color:#d9c9a8; font-size:1.6cqw; }
  .stats { display:flex; gap:1.4cqw; flex-wrap:wrap; justify-content:center; margin:1.4cqw 0; }
  .stats div { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); border-radius:1cqw; padding:1cqw 1.8cqw; }
  .stats b { display:block; font-size:2.6cqw; color:#fff4d6; } .stats small { font-size:1.2cqw; color:var(--muted); }
  .xp { font-size:3.4cqw; font-weight:900; color:var(--gold); text-shadow:0 0 2cqw rgba(245,183,0,.5); }
  .confetti { position:absolute; top:-4%; width:1.2cqw; height:1.8cqw; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110cqh) rotate(720deg); } }
  .bigbtns { display:flex; gap:1.4cqw; margin-top:1.8cqw; flex-wrap:wrap; justify-content:center; }
  .bigbtn { font-weight:900; font-size:1.8cqw; padding:1cqw 2.6cqw; border-radius:1cqw; border:0; background:var(--gold); color:#1a1206; box-shadow:0 .4cqw 0 #8a6300; }
  .bigbtn.sec { background:#30384a; color:#fff; box-shadow:0 .4cqw 0 #151a24; }
  .lawpop { position:absolute; right:3%; top:12%; width:36%; z-index:12; background:#f4ecd8; color:#2a1c12; border:.35cqw solid #c9a04a;
            border-radius:1cqw; padding:1.2cqw 1.4cqw; box-shadow:0 1cqw 2.4cqw rgba(0,0,0,.5); animation:pop .35s both; font-size:1.35cqw; }
  .lawpop b { display:block; font-size:1.5cqw; margin-bottom:.4cqw; } .lawpop .ref { font-family:var(--mono); font-size:1.05cqw; color:#8a5a2b; }
  .lawpop .law { font-family:Georgia,serif; }
  .keys { position:absolute; left:2.4%; top:9%; z-index:5; font-size:1.05cqw; color:rgba(255,255,255,.55); }

  /* ------------------------------------------------------------ criador de avatar */
  .creator { display:grid; grid-template-columns:260px 1fr; gap:22px; align-items:start; }
  .preview { background:linear-gradient(#3a2716,#1a110a); border-radius:18px; padding:10px; border:1px solid #5a3a1c; }
  .field { margin-bottom:14px; } .field label { display:block; font-weight:800; font-size:.85rem; color:var(--muted); margin-bottom:6px; }
  .swatches { display:flex; gap:8px; flex-wrap:wrap; }
  .sw { width:34px; height:34px; border-radius:10px; border:2px solid var(--line); }
  .sw[aria-pressed="true"] { border-color:var(--gold); box-shadow:0 0 0 3px rgba(245,183,0,.3); }
  .pill { border:1px solid var(--line); background:var(--panel-2); border-radius:99px; padding:6px 12px; font-weight:700; font-size:.85rem; }
  .pill[aria-pressed="true"] { border-color:var(--gold); color:var(--gold); }
  input[type=text] { font:inherit; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); width:100%; max-width:320px; }
  .save { background:var(--gold); color:#1a1206; border:0; border-radius:12px; padding:12px 20px; font-weight:900; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px; }
  /* ------------------------------------------------------------ carreira */
  .pbar { height:10px; border-radius:99px; background:var(--panel-2); overflow:hidden; width:min(320px, 100%); }
  .pbar i { display:block; height:100%; background:linear-gradient(90deg, var(--gold), #ffd866); }

  /* ------------------------------------------------------------ investigação */
  .scene.loc .floor, .scene.loc .desk { display:none; }
  .scene.loc .actor { bottom:0; width:36%; left:var(--ax,50%); }
  .spot { position:absolute; z-index:7; border:.3cqw dashed rgba(255,224,138,.85); border-radius:1cqw; background:rgba(255,224,138,.08);
          animation:glow 1.8s ease-in-out infinite; display:flex; align-items:flex-end; justify-content:center; padding:0; }
  .spot span { transform:translateY(120%); background:rgba(0,0,0,.75); color:#ffe08a; font-weight:800; font-size:1.2cqw; padding:.2cqw .8cqw;
               border-radius:.5cqw; white-space:nowrap; opacity:0; transition:opacity .15s; pointer-events:none; }
  .spot::before { content:""; position:absolute; inset:-10px; }
  .spot.up span { transform:translateY(-120%); position:absolute; top:0; }
  .spot:hover span, .spot:focus-visible span { opacity:1; }
  .spot:hover { background:rgba(255,224,138,.22); }
  .spot.seen { border-color:rgba(124,242,154,.7); animation:none; background:rgba(124,242,154,.06); }
  .spot.seen::after { content:"✓"; position:absolute; top:-1.4cqw; right:-1cqw; background:#2FBF71; color:#04210f; font-weight:900;
                      font-size:1.2cqw; width:2.2cqw; height:2.2cqw; border-radius:50%; display:grid; place-items:center; }
  @keyframes glow { 50% { box-shadow:0 0 1.6cqw rgba(255,224,138,.55); } }
  /* painel numa faixa baixa (84%-98% do palco): nenhum ponto de investigação passa de 82% de altura, então ele nunca tapa objeto */
  .inv-panel { position:absolute; left:2%; right:2%; bottom:2%; z-index:8; background:rgba(10,12,20,.92); border:.25cqw solid #d9d2c0;
               border-radius:1.2cqw; padding:.8cqw 1.2cqw; display:flex; flex-wrap:wrap; gap:.6cqw 1cqw; align-items:center; }
  .inv-panel h4 { margin:0; font-family:Georgia,serif; font-size:max(1.7cqw,11px); color:#fff4d6; }
  .inv-panel small { color:var(--muted); font-size:max(1.15cqw,9px); flex:1 1 12cqw; min-width:0; }
  .inv-panel button { text-align:left; font-size:max(1.35cqw,9px); font-weight:800; padding:.5cqw 1cqw; border-radius:.8cqw; border:.2cqw solid #4a5570;
                      background:#1c2333; display:flex; gap:.8cqw; align-items:center; }
  .inv-panel button:hover { border-color:var(--gold); }
  .inv-panel button.done { opacity:.6; }
  .inv-panel .go { background:var(--gold); color:#1a1206; border-color:var(--gold); justify-content:center; margin-left:auto; }
  .inv-panel .go:disabled { background:#30384a; color:#a3adbd; border-color:#30384a; cursor:not-allowed; }
  .inv-title { position:absolute; left:50%; transform:translateX(-50%); top:1.5%; white-space:nowrap; z-index:8; background:rgba(0,0,0,.6); color:#fff4d6; font-family:Georgia,serif; pointer-events:none;
               font-size:max(1.8cqw,11px); padding:.4cqw 1.4cqw; border-radius:.6cqw; border-left:.4cqw solid var(--gold); }
  .saved-toast { position:absolute; left:50%; top:3%; transform:translateX(-50%); z-index:9; font-size:1.1cqw; color:#a8e6c4;
                 background:rgba(0,0,0,.55); padding:.2cqw 1cqw; border-radius:99px; animation:flash 2s ease-out forwards; pointer-events:none; }
  .dilemma .q { color:#ffe08a; } .dhint { text-align:center; color:#d9c9a8; font-size:1.3cqw; margin-top:-.4cqw; }
  .actcard { background:radial-gradient(circle at 50% 45%, #2a1d10, #050403 72%); }
  .actcard .num { font-family:Georgia,serif; color:#c9a04a; letter-spacing:.6em; font-size:2.2cqw; animation:slidein .8s both; }
  .actcard h1 { font-family:Georgia,serif; font-size:7cqw; margin:.4cqw 0; color:#fff4d6; text-shadow:0 .5cqw 0 #6b3d10; animation:pop .9s .2s both; }
  .actcard .cargo { margin:1cqw 0; padding:.5cqw 2cqw; border:.25cqw solid #c9a04a; border-radius:99px; color:#ffe08a; font-weight:800; font-size:1.7cqw; animation:pop .6s .9s both; }
  .actcard p { color:#d9c9a8; max-width:58ch; font-size:1.6cqw; animation:slidein .8s 1.2s both; }
  .credits { background:#050403; overflow:hidden; justify-content:flex-start; }
  .credits .roll { animation:roll 46s linear forwards; padding-top:60cqh; }
  @keyframes roll { to { transform:translateY(-100%); } }
  .credits h2 { font-family:Georgia,serif; color:#F5B700; font-size:3cqw; margin:3cqw 0 .6cqw; }
  .credits p, .credits li { color:#d9c9a8; font-size:1.6cqw; margin:.3cqw 0; list-style:none; }
  .credits .big { font-size:5cqw; color:#fff4d6; font-family:Georgia,serif; }
  .credits .skip { position:absolute; right:2%; bottom:3%; z-index:2; }
  .achs { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:8px; margin:0 0 20px; }
  .ach { display:flex; gap:8px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 10px; font-size:.82rem; }
  .ach b { display:block; font-size:.86rem; } .ach small { color:var(--muted); }
  .ach .ic { font-size:1.4rem; } .ach.off { opacity:.4; filter:grayscale(1); }
  .choices { margin:0 0 20px; color:var(--muted); font-size:.9rem; } .choices li { margin:2px 0; }
  /* ============================================================ passe de arte: identidade visual, personagens animados, foco/hover */
  :root { --serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif; --focus:#ffd866; --ink:#1b1410; }
  .hero h1, .career-head h2, .act-title h3, .act-title b, .titlecard h1, .titlecard .ep, .actcard h1, .verdict h2, .credits h2, .modal header h2,
  .nameplate, .inv-title, .inv-panel h4, .banner span, .stamp { font-family:var(--serif); }
  a:focus-visible, input:focus-visible, [tabindex]:focus-visible, .spot:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
  .modal :focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
  .modal header :focus-visible { outline-color:#fff4d6; }
  /* personagens */
  .breath { transform-box:fill-box; transform-origin:50% 100%; animation:breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 50% { transform:scaleY(1.014); } }
  .head { transform-box:fill-box; transform-origin:50% 100%; animation:headtilt 6s ease-in-out infinite; }
  @keyframes headtilt { 50% { transform:rotate(.8deg) translateY(-1px); } }
  .arm-point { animation:pointpump 1.1s ease-in-out infinite; }
  @keyframes pointpump { 50% { transform:translate(3px,-2px); } }
  .actor.shock .head { animation:startle .45s ease; }
  @keyframes startle { 25% { transform:translateY(-7px) scale(1.04); } 60% { transform:translateY(1px) scale(.99); } }
  /* título e logotipo */
  .titlecard h1::after { content:""; display:block; height:.3cqw; width:16cqw; margin:1.4cqw auto 0; background:linear-gradient(90deg, transparent, #c9a04a, transparent); }
  /* botões: hover, foco e contraste AA */
  .hudbtn, .xbtn, .pbtn, .bigbtn, .iconbtn, .save, .pill, .sw, .opt, .ev, .inv-panel button, .tabs2 button, .modal .x { transition:transform .12s, filter .15s, box-shadow .15s, border-color .15s, background .15s; }
  .hudbtn:hover, .xbtn:hover, .pbtn:hover:not(:disabled), .bigbtn:hover, .save:hover { filter:brightness(1.12); transform:translateY(-1px); }
  .hudbtn:active, .xbtn:active, .pbtn:active:not(:disabled), .bigbtn:active, .save:active { transform:translateY(.25cqw); }
  .iconbtn:hover, .pill:hover, .sw:hover { border-color:var(--gold); }
  .hudbtn:focus-visible, .xbtn:focus-visible, .bigbtn:focus-visible, .opt:focus-visible, .inv-panel button:focus-visible, .pbtn:focus-visible { outline:.3cqw solid var(--focus); outline-offset:.3cqw; }
  .opt:hover, .opt:focus-visible { border-color:var(--gold); background:linear-gradient(#2c3650,#1c2333); transform:translateX(.5cqw); }
  .opt:hover b, .opt:focus-visible b { background:var(--gold); }
  .x-defer { background:#177a47; } .x-press { background:#2a5fd6; }
  .keys { color:rgba(255,255,255,.78); }
  /* caixa de diálogo */
  .dialog { background:linear-gradient(180deg, rgba(20,26,44,.95), rgba(8,10,18,.97)); border-color:#e4dcc6; }
  .dialog::before { content:""; position:absolute; inset:.55cqw; border:.12cqw solid rgba(201,160,74,.5); border-radius:.8cqw; pointer-events:none; }
  .dialog:focus-visible { outline:.3cqw solid var(--focus); outline-offset:.3cqw; }
  .nameplate { display:flex; align-items:center; gap:.7cqw; letter-spacing:.04em; border:.2cqw solid #141821; border-bottom:0; box-shadow:0 -.2cqw .8cqw rgba(0,0,0,.35); }
  .nameplate::before { content:""; width:.9cqw; height:.9cqw; background:#141821; transform:rotate(45deg); opacity:.75; }
  .text { text-shadow:0 .1cqw .2cqw rgba(0,0,0,.5); }
  /* autos */
  .modal { background:repeating-linear-gradient(0deg, rgba(138,90,43,.05) 0 .2cqw, transparent .2cqw .9cqw), linear-gradient(#f6eedb,#e8dcbf); }
  .modal header { background:linear-gradient(#9a6630,#7a4d22); border-bottom:.3cqw solid #c9a04a; }
  .ev { cursor:pointer; box-shadow:0 .25cqw 0 rgba(138,90,43,.35); }
  .ev:hover, .ev:focus-visible { transform:translateY(-.4cqw) rotate(-.6deg); border-color:#8a5a2b; box-shadow:0 .8cqw 1.4cqw rgba(60,35,10,.3); }
  .detail { background:#fffaf0 repeating-linear-gradient(0deg, transparent 0 1.9cqw, rgba(138,90,43,.08) 1.9cqw 2cqw); }
  html.aba-oculta *, html.aba-oculta *::before, html.aba-oculta *::after { animation-play-state:paused !important; }   /* aba em segundo plano: nada anima */
  .ap, .ap * { animation-play-state:paused !important; }   /* fora da tela: sem animação (ver animIO) */
  .tile:not(:hover):not(:focus-visible) .cover * { animation-play-state:paused !important; }   /* miniaturas: respiração/piscar de 1% não se vê e custa um re-render por quadro */
  @media (prefers-reduced-motion: reduce) { .breath, .head, .arm-point { animation:none !important; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition:none !important; } }
  /* ============================================================ menu estilo streaming (identidade "Vade Tribunal": noite, vidro e âmbar) */
  :root { --v-bg:#0B0D11; --v-bg-2:#12151B; --v-surface:#181C24; --v-surface-2:#222833; --v-line:#2C3340;
          --v-text:#ECEEF2; --v-muted:#9AA3B2; --v-faint:#6B7383; --v-gold:#D4A24C; --v-gold-2:#E8BE6A; --v-on-gold:#16110A;
          --v-steel:#5B7BA6; --v-ok:#3FBF7F; --v-bad:#E5534B; --v-warn:#E8A33D; --v-r:10px; --v-r-lg:16px; --v-shadow:0 10px 30px rgba(0,0,0,.45);
          --v-ease:cubic-bezier(.2,.7,.2,1); --v-serif:Georgia,"Times New Roman",serif; --v-sans:"Segoe UI",system-ui,sans-serif;
          --night:var(--v-bg); --night-2:var(--v-surface); --amber:var(--v-gold); --amber-2:var(--v-gold-2); --amber-d:#8E6A2A;
          --ivory:var(--v-text); --mute:var(--v-muted); --hair:rgba(212,162,76,.3); --gutter:clamp(16px, 4vw, 56px); }
  #menu.wrap { max-width:none; padding:0 0 60px; overflow-x:clip; background:linear-gradient(180deg, var(--night) 0%, var(--v-bg-2) 60%, var(--night) 100%); min-height:100%; }
  #menu .gold, .gold { background:linear-gradient(180deg, #FFF1C9 0%, #EDB955 48%, #B07A22 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  /* barra superior */
  .nav { position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px; padding:10px var(--gutter);
         background:linear-gradient(180deg, rgba(11,13,17,.80), rgba(11,13,17,.66)); backdrop-filter:blur(12px); border-bottom:1px solid rgba(237,185,85,.14); }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ivory); font-family:var(--v-serif); letter-spacing:.24em; font-size:.82rem; font-weight:700; white-space:nowrap; }
  .brand svg { width:34px; height:34px; flex:none; }
  .brand b { color:var(--amber); font-weight:700; }
  .navlinks { display:flex; gap:2px; margin-left:18px; }
  .navlinks button { background:none; border:0; color:var(--mute); font-weight:600; font-size:.92rem; padding:8px 12px; border-radius:8px; }
  .navlinks button:hover { color:var(--ivory); background:rgba(255,255,255,.06); }
  .nav .sp { flex:1; }
  .navbtn { color:var(--mute); text-decoration:none; font-weight:600; font-size:.9rem; padding:8px 10px; border-radius:8px; }
  .navbtn:hover { color:var(--ivory); background:rgba(255,255,255,.06); }
  .nav .iconbtn { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.14); color:var(--ivory); border-radius:999px; padding:6px 12px; font-weight:600; font-size:.88rem; }
  .nav .iconbtn[aria-pressed="false"] { border-style:dashed; color:var(--mute); text-decoration:line-through; text-decoration-color:rgba(185,193,207,.5); }
  .profile { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.05); border:1px solid rgba(237,185,85,.35); border-radius:999px; padding:3px 14px 3px 3px; color:var(--ivory); text-align:left; }
  .profile:hover { background:rgba(237,185,85,.12); }
  .pf-av { width:40px; height:40px; border-radius:50%; overflow:hidden; flex:none; background:radial-gradient(circle at 50% 30%, #3b4a66, #131a29); border:2px solid var(--amber); }
  .pf-av svg, .cast-c .pt-av svg { width:100%; height:100%; display:block; }
  .pf-tx { display:flex; flex-direction:column; line-height:1.15; min-width:92px; }
  .pf-tx b { font-size:.88rem; max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pf-tx small { font-size:.72rem; color:var(--mute); }
  .pf-xp { display:block; height:4px; border-radius:4px; background:rgba(255,255,255,.14); margin-top:3px; overflow:hidden; }
  .pf-xp u { display:block; height:100%; background:linear-gradient(90deg, var(--amber-d), var(--amber-2)); text-decoration:none; }
  /* destaque (hero) */
  .hero { position:relative; margin:0; padding:0; border:0; border-radius:0; overflow:hidden; height:min(74vh, 700px); min-height:470px; background:var(--night); display:flex; align-items:flex-end; }
  .hero-art { position:absolute; inset:0; -webkit-mask-image:linear-gradient(180deg, #000 0%, #000 52%, transparent 96%); mask-image:linear-gradient(180deg, #000 0%, #000 52%, transparent 96%); }
  .hero-art .sky, .dtl-art .sky, .intro .sky { position:absolute; inset:0; }
  .hero-art .sky svg, .dtl-art .sky svg, .intro .sky svg { width:100%; height:100%; display:block; }
  .hero-figs, .dtl-figs { position:absolute; right:clamp(0px, 3vw, 70px); bottom:0; height:70%; display:flex; align-items:flex-end; animation:figin .9s var(--v-ease) both .15s; }
  .hero-figs .fig, .dtl-figs .fig { height:100%; flex:none; aspect-ratio:280 / 300; margin-left:clamp(-90px, -5.5vw, -30px); } .hero-figs .fig:first-child, .dtl-figs .fig:first-child { margin-left:0; }
  .fig svg { height:100%; width:auto; display:block; overflow:visible; filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)); }
  .fig.back { height:90%; filter:brightness(.7) saturate(.85); }
  .fig.you { z-index:2; }
  @keyframes figin { from { opacity:0; transform:translateX(40px); } }
  .hero-scrim { position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(90deg, rgba(11,13,17,.97) 0%, rgba(11,13,17,.88) 36%, rgba(11,13,17,.3) 64%, rgba(11,13,17,0) 100%), linear-gradient(0deg, var(--night) 0%, rgba(11,13,17,0) 34%); }
  .hero-body { position:relative; z-index:2; padding:0 var(--gutter) clamp(34px, 7vh, 72px); max-width:min(660px, 100%); }
  .hero-tag { display:flex; align-items:center; gap:10px; font-weight:800; font-size:.78rem; letter-spacing:.26em; text-transform:uppercase; color:var(--amber); margin-bottom:12px; }
  .hero-tag svg { width:22px; height:22px; }
  .hero h1 { margin:0 0 12px; font-family:var(--v-serif); font-size:clamp(2.2rem, 5.4vw, 4.4rem); line-height:1.02; letter-spacing:-.01em; color:var(--ivory); text-shadow:0 4px 24px rgba(0,0,0,.7); }
  .meta { display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; margin:0 0 14px; font-size:.9rem; color:var(--mute); }
  .meta .chip { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); color:var(--ivory); font-size:.78rem; padding:2px 10px; }
  .meta .chip.advogado { color:#B9CBFF; } .meta .chip.promotor { color:#FFB8AF; } .meta .chip.juiz { color:#DCCBFF; } .meta .chip.investigado { color:#E4E6EA; }
  .hero p.syn { margin:0 0 20px; color:#E4DDCD; font-size:clamp(.95rem, 1.5vw, 1.12rem); max-width:54ch; text-shadow:0 2px 12px rgba(0,0,0,.8); display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .cta { display:flex; flex-wrap:wrap; gap:12px; }
  .btn { display:inline-flex; align-items:center; gap:9px; border:0; border-radius:8px; padding:12px 26px; font-weight:800; font-size:1.02rem; letter-spacing:.02em; transition:transform .15s, background .15s, box-shadow .15s; }
  .btn.pri { background:linear-gradient(180deg, #F8D58A, #EDB955); color:var(--v-on-gold); box-shadow:0 6px 22px rgba(237,185,85,.28); }
  .btn.pri:hover { transform:translateY(-1px); box-shadow:0 8px 28px rgba(237,185,85,.45); }
  .btn.sec { background:rgba(36,46,66,.9); color:var(--ivory); border:1px solid rgba(255,255,255,.22); }
  .btn.sec:hover { background:rgba(58,72,100,.95); }
  .btn svg { width:16px; height:16px; }
  .btn:focus-visible, .profile:focus-visible, .nav button:focus-visible, .nav a:focus-visible { outline:2px solid var(--v-gold); outline-offset:3px; }
  /* faixa de carreira */
  .strip { display:flex; flex-wrap:wrap; align-items:center; gap:8px 18px; padding:18px var(--gutter) 2px; color:var(--mute); font-size:.9rem; }
  .strip b { color:var(--ivory); font-family:var(--v-serif); font-size:1.05rem; }
  .strip .pbar { height:6px; width:min(260px, 100%); background:rgba(255,255,255,.12); }
  .strip .pbar i { background:linear-gradient(90deg, var(--amber-d), var(--amber-2)); }
  /* temporadas e carrosséis */
  #eps { padding-top:6px; }
  .season { margin:0; padding-top:18px; scroll-margin-top:70px; }
  .season.locked .s-head { opacity:.75; }
  .s-head { display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 14px; padding:0 var(--gutter); }
  .s-head .eyebrow { font-weight:800; font-size:.74rem; letter-spacing:.26em; text-transform:uppercase; color:var(--amber); }
  .s-head h2 { margin:0; font-family:var(--v-serif); font-size:clamp(1.2rem, 2.2vw, 1.7rem); color:var(--ivory); }

           border-radius:.9em; border:.22em solid var(--rc); background:linear-gradient(165deg, #232a38, #12161e); color:#ECEEF2; font-size:inherit; font-family:inherit; box-shadow:0 .3em 1em rgba(0,0,0,.5); }

  for (const c of cs) {  // espelha tribunal.episode_marks: efeitos de convocar, intuição e marcas automáticas
    if (c.tipo === "convocar") c.opcoes.forEach(o => o.efeito && o.efeito.marca && out.add(o.efeito.marca));
    if (c.tipo === "intuicao" || c.tipo === "tensao" || c.tipo === "celular") (c.opcoes || []).forEach(o => o.marca && out.add(o.marca));

// relógio das decisões: campo "tempo" (s) na cena; no nível impossível vale 40 s por padrão. Esgotar = erro e repete.
const NUNCA = new Promise(() => {});
function startClock(c) {
  const s = c.tempo || (EP && EP.nivel === "impossivel" ? 40 : 0);
  if (!s) return null;
  const bar = el("i"), box = el("div", {class:"dclock", role:"timer", "aria-label":`${s} segundos para decidir`}, bar);
  $("#stage").append(box);
  let done, last = -1;
  const p = new Promise(r => { done = r; }), t0 = performance.now();
  // setInterval (e não rAF): o relógio corre mesmo com a aba em segundo plano
  const iv = setInterval(() => {
    const f = (performance.now() - t0) / (s * 1000);
    bar.style.transform = `scaleX(${Math.max(0, 1 - f)})`; box.classList.toggle("late", f > .75);
    const sec = Math.floor((1 - f) * s); if (f > .75 && sec !== last) { last = sec; Sound.coracao(); }
    if (f >= 1) { clearInterval(iv); done("timeout"); }
  }, 50);
  return {p, stop() { clearInterval(iv); box.remove(); }};
}

// resume: true continua do jogo salvo (o servidor guarda cena, credibilidade, erros e autos)
async function startEpisode(id, resume = false) {
  Sound.ensure();
  if (!resume) { try { await api("/api/arena/tribunal/recomecar", {episodio:id}); } catch (e) { /* sem salvo */ } }
  EP = await api("/api/arena/tribunal/" + encodeURIComponent(id));
  const s = resume ? EP.salvo : null;
  if (!CAR) { try { CAR = await api("/api/arena/carreira"); } catch (e) { /* jogo avulso */ } }
  G = {resumed:!!s, cred:s ? Math.max(3, s.credibilidade) : 5, erros:s ? s.erros : 0, autos:s ? [...s.autos] : [], marcas:s ? [...(s.marcas || [])] : [], descartadas:s ? [...(s.descartadas || [])] : [], examinadas:[], over:false, scene:null, combo:0, comboMax:0, certeiras:0, t0:Date.now()};
  curPos = null; curChar = null;
  $("#menu").classList.add("hidden"); $("#game").classList.remove("hidden");
  [...$("#stage").querySelectorAll(".full, .modal, .lawpop, .inv-title")].forEach(n => n.remove());
  $("#fx").replaceChildren(); clearOverlay(); hideDialog(); renderCred(); renderCombo();
  await camera(ROLE_PLAQUE[EP.papel], null);
  let sid = s && EP.cenas[s.cena] ? s.cena : EP.inicio;
  if (s) Sound.startMusic("calma");
  const token = G;
  while (sid && token === G && !G.over) {
    const cur = sid; sid = await runScene(sid);
    // desvio condicional: uma escolha anterior (marca) leva a história para outra cena
    if (sid && token === G && !G.over) { const dv = (EP.cenas[cur].desvio || []).find(d => cond(d.se)); if (dv) sid = dv.proxima; }
    if (sid && token === G && !G.over && EP.cenas[sid].tipo !== "veredicto") saveProgress(sid);
  }
}

  if (G && G.acKeys) { if (["a", "enter", "tab", "arrowleft", "arrowright"].includes(k) || /^[1-9]$/.test(k)) { e.preventDefault(); G.acKeys(k); } return; }

    const map = {arrowleft:"prev", arrowright:"next", p:"press", a:"present", e:"dismiss"};
    if (map[k]) { e.preventDefault(); G.xkeys(map[k]); }

  }
  if (G && G.audKeys && (k === "x" || k === "enter" || k === " ")) { if (k !== "x" && e.target.closest && e.target.closest("button")) return; e.preventDefault(); G.audKeys(k === "x" ? "intervir" : "seguir"); return; }
  if (G && G.choiceKeys && /^[0-9]$/.test(k)) { G.choiceKeys(k === "0" ? -1 : Number(k) - 1); return; }
  if (G && G.decideKeys && (k === "d" || k === "i")) { G.decideKeys(k === "d" ? "deferir" : "indeferir"); return; }
  if (k === "a" && G) { openAutos(null); return; }

// seção sec=cenarios da galeria: tribunal nas 5 posições + locais de investigação, com personagem de referência e os pontos
// de investigação de todos os casos desenhados por cima. Params: w=px (padrão 800) · ref=0,1,2,3 (personagens de referência) · f=filtro por local/posição · painel=1
async function galeriaCenarios(P, root) {
  const W = +P.get("w") || 800, filtro = (P.get("f") || "").toLowerCase(), painel = P.get("painel") === "1";
  const REFS = [{pele:"#C68642", cabelo:"curto", corCabelo:"#2a1a10", roupa:"terno", corRoupa:"#1f2a44", gravata:"#8a1c1c"},
    {pele:"#FFDBAC", cabelo:"curto", corCabelo:"#c9a227", roupa:"toga", corRoupa:"#111111", gravata:null},
    {pele:"#F1C27D", cabelo:"curto", corCabelo:"#7b1e1e", roupa:"avental", corRoupa:"#ffffff", gravata:null},
    {pele:"#8D5524", cabelo:"curto", corCabelo:"#111111", roupa:"casual", corRoupa:"#c0392b", gravata:null}];
  const refs = (P.get("ref") || "0").split(",").map(Number).filter(i => REFS[i]);
  const css = el("style", {textContent:`.galroot .cen { position:relative; width:${W}px; max-width:100%; aspect-ratio:16/10; overflow:hidden; container-type:inline-size; border-radius:6px; margin:6px 0 2px; background:#000; }

    .galroot .gspot { position:absolute; z-index:7; border:.25cqw solid #ff2bd6; background:rgba(255,43,214,.14); box-sizing:border-box; pointer-events:none; }
    .galroot .gspot b { position:absolute; left:0; top:0; background:#ff2bd6; color:#fff; font:700 1.05cqw/1.25 system-ui; padding:0 .4cqw; white-space:nowrap; max-width:30cqw; overflow:hidden; text-overflow:ellipsis; }
    .galroot .gspot.alt b { top:auto; bottom:0; background:#00a6c8; } .galroot .gspot.alt { border-color:#00a6c8; background:rgba(0,166,200,.14); }`});
  if (P.get("ator") === "0") css.textContent += ".galroot .cen .actor { display:none; }";
  if (P.get("ax")) css.textContent += `.galroot .cen .scene.loc .actor { left:${+P.get("ax")}%; }`;
  if (P.get("solo") === "1") css.textContent += ".galroot h1, .galroot .bar, .galroot h2, .galroot .who { display:none; } body.gal { padding:0 !important; overflow:hidden !important; }";
  root.append(css, el("h2", {textContent:"Cenários: tribunal e locais de investigação (personagem de referência + pontos de todos os casos)"}));
  const POS = ["defesa", "acusacao", "testemunha", "juiz", "escritorio"];
  const mk = (kind, bg, extra, v, expr, spots) => {
    const box = el("div", {class:"cen"});
    box.innerHTML = `<div class="stg"><div class="scene${kind}"><div class="bg">${bg}</div>${kind ? "" : '<div class="floor"></div>'}<div class="actor idle">${characterSVG(v, expr)}</div>${extra}</div></div>`;
    spots.forEach((s, i) => { const d = el("div", {class:"gspot" + (i % 2 ? " alt" : ""), style:{left:s.x + "%", top:s.y + "%", width:s.w + "%", height:s.h + "%"}}, el("b", {textContent:s.nomes}));
      box.append(d); });
    return box;
  };
  for (const pos of POS) {
    if (filtro && !pos.includes(filtro)) continue;
    root.append(el("div", {class:"who"}, el("b", {textContent:"Tribunal: " + pos})));
    for (const ri of refs) {
      const bx = mk("", background(pos), `<div class="desk">${desk(pos)}</div>`, REFS[ri], "normal", []);
      const pl = (BGS[pos] || {}).plaque;
      if (pl && pos !== "escritorio") bx.querySelector(".desk").append(el("div", {class:"plaque", textContent:pl}));
      root.append(bx);
    }
  }
  // pontos de todos os episódios, agrupados por local
  const car = await api("/api/arena/carreira");
  const ids = [...car.atos.flatMap(a => a.episodios.map(e => e.id)), ...car.avulsos.map(e => e.id)];
  const eps = await Promise.all(ids.map(id => api("/api/arena/tribunal/" + id).catch(() => null)));

  for (const ep of eps) { if (!ep) continue;
    for (const c of Object.values(ep.cenas || {})) { if (!c.pontos || !c.local) continue;
      const m = porLocal[c.local] = porLocal[c.local] || {};
      for (const p of c.pontos) { const k = [p.x, p.y, p.w, p.h].join(","); (m[k] = m[k] || {x:p.x, y:p.y, w:p.w, h:p.h, nomes:new Set()}).nomes.add(p.nome); } } }
  for (const loc of Object.keys(LOCAL_NOME)) {
    if (filtro && !loc.includes(filtro)) continue;
    const spots = Object.values(porLocal[loc] || {}).map(s => ({...s, nomes:[...s.nomes].join(" / ")}));
    root.append(el("div", {class:"who"}, el("b", {textContent:`Local: ${loc} (${LOCAL_NOME[loc]})`}), " ", el("code", {textContent:spots.length + " pontos distintos"})));
    for (const ri of refs) {
      const bx = mk(" loc", locationBG(loc), "", REFS[ri], "apontando", spots);
      if (painel) bx.append(el("div", {class:"inv-panel"}, el("h4", {textContent:"Investigação"}), el("small", {textContent:"Examinados: 0 de " + spots.length}), el("button", {textContent:"💬 Conversar"}), el("button", {textContent:"Seguir ▶"})));
      root.append(bx);
    }
  }
}
// ================================================================ galeria de QA de arte (?galeria=1)
// Parâmetros: sec=elenco|combinatoria|palco|tudo (padrão tudo) · de/ate (índices do elenco) · fundo=ambos|claro|escuro

  const exprs = P.get("expr") ? P.get("expr").split(",").filter(x => EXPRS.includes(x)) : EXPRS;

    .galroot .bar { position:sticky; top:0; z-index:3; background:#20232b; padding:6px 0; display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:13px; }

    html:has(body.gal) { background:#20232b; }

    .galroot .cell.claro { background:#f3efe6; color:#222; } .galroot .cell.escuro { background:#14161c; color:#ddd; }
    .galroot .cell svg { display:block; width:${tam}px; height:auto; overflow:visible; }
    .galroot .stagebox { position:relative; width:480px; aspect-ratio:16/10; overflow:hidden; border-radius:8px; container-type:inline-size; }
    .galroot .stagebox .actor { position:absolute; }`});

  const talkBox = el("input", {type:"checkbox", onchange:e => root.classList.toggle("talking", e.target.checked)});

    el("div", {class:"bar"}, el("label", {}, talkBox, " animar boca (falando)"),

  const fundos = fundo === "ambos" ? ["claro", "escuro"] : [fundo];

        })));
