<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Vade Arena</title>
<style>
  :root {
    --v-bg:#0B0D11; --v-bg-2:#12151B; --v-surface:#181C24; --v-surface-2:#222833; --v-line:#2C3340;
    --v-text:#ECEEF2; --v-muted:#9AA3B2; --v-faint:#6B7383;
    --v-gold:#D4A24C; --v-gold-2:#E8BE6A; --v-on-gold:#16110A;
    --v-steel:#5B7BA6; --v-steel-t:#9DB6D9; --v-ok:#3FBF7F; --v-bad:#E5534B; --v-bad-t:#F28B85; --v-warn:#E8A33D;
    --v-r:10px; --v-r-lg:16px; --v-shadow:0 10px 30px rgba(0,0,0,.45);
    --v-serif:Georgia,"Times New Roman",serif; --v-sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    --v-ease:cubic-bezier(.2,.7,.2,1);
    --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
    --pad:clamp(16px, 4vw, 56px); --hh:64px;
  }
  * { box-sizing:border-box; }
  html { color-scheme:dark; }
  html, body { margin:0; background:var(--v-bg); color:var(--v-text); }
  body { font:15px/1.55 var(--v-sans); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  body.lock { overflow:hidden; }
  button { font:inherit; cursor:pointer; color:inherit; }
  a { color:var(--v-gold-2); }
  :is(button, a, summary, [tabindex]):focus-visible { outline:2px solid var(--v-gold); outline-offset:3px; }
  h1, h2, h3 { font-family:var(--v-serif); letter-spacing:.02em; font-weight:700; margin:0; }
  .muted { color:var(--v-muted); }
  .skip { position:absolute; left:-999px; top:8px; background:var(--v-gold); color:var(--v-on-gold); padding:8px 14px;
          border-radius:8px; font-weight:700; z-index:100; }
  .skip:focus { left:8px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* ---------- barra superior */
  .top { position:sticky; top:0; z-index:30; height:var(--hh); border-bottom:1px solid rgba(44,51,64,.6); }
  /* o desfoque fica num pseudo-elemento: backdrop-filter no próprio .top prenderia a navegação fixa (celular) */
  .top::before { content:""; position:absolute; inset:0; z-index:-1; background:rgba(11,13,17,.72);
         -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  .top-in { height:100%; padding:0 var(--pad); display:flex; gap:clamp(14px,2.4vw,34px); align-items:center; }
  .brand { min-height:44px; display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--v-text); font-family:var(--v-sans);
           font-weight:700; letter-spacing:.18em; text-transform:uppercase; font-size:1.05rem; }
  .brand::after { content:""; width:26px; height:2px; background:var(--v-gold); order:1; }
  .brand small { font-size:.7rem; color:var(--v-muted); letter-spacing:.22em; order:2; }
  nav.tabs { display:flex; gap:2px; align-items:center; }
  nav.tabs a, nav.tabs button { border:0; background:none; text-decoration:none; color:var(--v-muted); font-weight:600;
      padding:0 14px; min-height:44px; display:inline-flex; align-items:center; gap:6px; border-radius:8px;
      transition:color .2s var(--v-ease); font-size:.95rem; position:relative; }
  nav.tabs :is(a, button):hover { color:var(--v-text); }
  nav.tabs [aria-current="page"] { color:var(--v-text); }
  nav.tabs [aria-current="page"]::after { content:""; position:absolute; left:14px; right:14px; bottom:4px; height:2px; background:var(--v-gold); }
  nav.tabs .tribunal { color:var(--v-gold-2); }
  .hud { margin-left:auto; display:flex; gap:14px; align-items:center; }
  .streak { font-weight:700; color:var(--v-gold-2); display:flex; align-items:center; gap:4px; font-variant-numeric:tabular-nums; }
  .streak.off { color:var(--v-muted); }
  .profile { display:flex; align-items:center; gap:10px; background:none; border:1px solid transparent; border-radius:99px;
             padding:3px 12px 3px 3px; min-height:44px; text-align:left; transition:border-color .2s var(--v-ease), background .2s; }
  .profile:hover { border-color:var(--v-line); background:rgba(34,40,51,.6); }
  .avatar-p { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-variant-numeric:tabular-nums;
              background:radial-gradient(circle at 30% 25%, var(--v-gold-2), var(--v-gold) 60%, #9a712b); color:var(--v-on-gold); flex:none; }
  .pinfo { min-width:116px; } .pinfo b { display:block; font-size:.82rem; line-height:1.2; font-weight:600; }
  .xpbar { height:5px; background:var(--v-surface-2); border-radius:99px; overflow:hidden; margin-top:4px; }
  .xpbar > i { display:block; height:100%; background:var(--v-gold); width:0; transition:width .8s var(--v-ease); }

  /* ---------- estrutura */
  main { min-height:calc(100vh - var(--hh)); outline:none; }
  .wrap { max-width:960px; margin:0 auto; padding:28px var(--pad) 90px; }
  .wrap.wide { max-width:1180px; }
  .page-head { padding:34px var(--pad) 6px; }
  .page-head h1 { font-size:clamp(1.8rem,3.4vw,2.6rem); }
  .page-head p { color:var(--v-muted); margin:8px 0 0; max-width:70ch; }
  .rows { padding-bottom:90px; }
  .btn { border:1px solid var(--v-line); background:var(--v-surface-2); color:var(--v-text); min-height:44px; padding:0 20px; border-radius:8px;
         font-weight:700; display:inline-flex; align-items:center; gap:8px; text-decoration:none; transition:background .2s var(--v-ease), transform .2s var(--v-ease); }
  .btn:hover:not(:disabled) { background:#2b3341; }
  .btn.primary { background:var(--v-gold); border-color:var(--v-gold); color:var(--v-on-gold); }
  .btn.primary:hover:not(:disabled) { background:var(--v-gold-2); }
  .btn.glass { background:rgba(236,238,242,.14); border-color:rgba(236,238,242,.22); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  .btn.glass:hover:not(:disabled) { background:rgba(236,238,242,.24); }
  .btn.ghost { background:none; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .spacer { flex:1; }
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:.72rem; font-weight:700; padding:3px 9px; letter-spacing:.06em;
          border-radius:99px; background:var(--v-surface-2); color:var(--v-muted); border:1px solid var(--v-line); text-transform:uppercase; }
  .chip.gold { color:var(--v-gold-2); border-color:rgba(212,162,76,.45); background:rgba(212,162,76,.1); }
  .chip.steel { color:var(--v-steel-t); border-color:rgba(91,123,166,.5); background:rgba(91,123,166,.12); }
  .chip.bad { color:var(--v-bad-t); border-color:rgba(229,83,75,.5); background:rgba(229,83,75,.1); }
  .chip.ok { color:var(--v-ok); border-color:rgba(63,191,127,.45); background:rgba(63,191,127,.1); }
  .eyebrow { font:700 .74rem/1 var(--v-sans); letter-spacing:.18em; text-transform:uppercase; color:var(--v-gold-2); }
  .empty { text-align:center; padding:30px; color:var(--v-muted); background:var(--v-surface); border:1px solid var(--v-line); border-radius:var(--v-r); }
  kbd { font-family:var(--mono); font-size:.75rem; border:1px solid var(--v-line); border-bottom-width:2px; border-radius:5px; padding:0 6px; background:var(--v-surface-2); color:var(--v-text); }

  /* ---------- arte */
  .art { position:absolute; inset:0; overflow:hidden; background:#10141c; }
  .art svg { width:100%; height:100%; display:block; }

  /* ---------- destaque (hero) */
  .hero { position:relative; margin-top:calc(-1 * var(--hh)); min-height:clamp(420px, 66vh, 640px); display:flex; align-items:flex-end; overflow:hidden; }
  .hero::before { content:""; position:absolute; inset:0; z-index:1; background:linear-gradient(90deg, var(--v-bg) 0%, rgba(11,13,17,.6) 45%, transparent 75%); }
  .hero::after { content:""; position:absolute; inset:0; z-index:1; background:linear-gradient(0deg, var(--v-bg) 0%, transparent 60%); }
  .hero-in { position:relative; z-index:2; padding:calc(var(--hh) + 40px) var(--pad) clamp(28px,5vw,64px); max-width:760px; }
  .hero h1 { font-size:clamp(2rem,4.6vw,3.6rem); line-height:1.08; margin:12px 0 12px; text-shadow:0 2px 24px rgba(0,0,0,.6); }
  .hero .meta { display:flex; flex-wrap:wrap; gap:6px 14px; color:var(--v-text); font-size:.92rem; margin-bottom:12px; }
  .hero .meta span + span::before { content:"·"; margin-right:14px; color:var(--v-gold); }
  .hero p { color:#cfd4dd; max-width:58ch; margin:0 0 22px; font-size:1.02rem; }
  .hero .cta { display:flex; gap:12px; flex-wrap:wrap; }
  .hero .btn { min-height:48px; padding:0 26px; font-size:1rem; }

  /* ---------- fileiras e cartões 16:9 */
  .rowsec { margin:6px 0 22px; position:relative; }
  .rowsec > h2 { padding:0 var(--pad); font-size:clamp(1.15rem,1.7vw,1.4rem); margin-bottom:4px; }
  .rowsec > .rsub { padding:0 var(--pad); color:var(--v-muted); font-size:.85rem; margin:0 0 6px; }
  .railwrap { position:relative; }
  .rail { display:flex; gap:clamp(10px,1.2vw,18px); overflow-x:auto; padding:14px var(--pad) 22px; scroll-snap-type:x proximity;
          scroll-padding:0 var(--pad); scroll-behavior:smooth; scrollbar-width:none; overscroll-behavior-x:contain; }
  .rail::-webkit-scrollbar { display:none; }
  .arrow { position:absolute; top:14px; bottom:22px; width:var(--pad); min-width:44px; z-index:3; border:0; color:var(--v-text); font-size:1.8rem;
           background:linear-gradient(90deg, rgba(11,13,17,.92), transparent); opacity:0; transition:opacity .2s var(--v-ease); display:none; }
  .arrow.r { right:0; background:linear-gradient(270deg, rgba(11,13,17,.92), transparent); }
  .arrow.l { left:0; }
  @media (hover:hover) { .arrow { display:block; } .railwrap:hover .arrow:not([hidden]) { opacity:1; } }
  .tile { position:relative; flex:0 0 clamp(250px, 24vw, 340px); aspect-ratio:16/9; border:1px solid var(--v-line); border-radius:var(--v-r);
          overflow:hidden; background:var(--v-surface); text-align:left; padding:0; scroll-snap-align:start; color:var(--v-text); text-decoration:none; display:block;
          transition:transform .22s var(--v-ease), box-shadow .22s var(--v-ease), border-color .22s var(--v-ease); }
  .tile:hover, .tile:focus-visible { transform:translateY(-4%) scale(1.02); box-shadow:var(--v-shadow); border-color:rgba(212,162,76,.6); z-index:2; }
  .tile::after { content:""; position:absolute; inset:0; background:linear-gradient(0deg, rgba(11,13,17,.97) 0%, rgba(11,13,17,.55) 42%, transparent 70%); pointer-events:none; }
  .tile-body { position:absolute; left:0; right:0; bottom:0; padding:12px 14px 13px; z-index:2; }
  .tile h3 { font-size:1.02rem; line-height:1.2; margin:3px 0 4px; text-shadow:0 1px 8px rgba(0,0,0,.8); }
  .tile .kick { font:700 .66rem/1 var(--v-sans); letter-spacing:.14em; text-transform:uppercase; color:var(--v-gold-2); }
  .tile .tmeta { font-size:.78rem; color:#c3c9d4; display:block; }
  .tile .prog { position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(236,238,242,.15); z-index:3; }
  .tile .prog i, .gbar i { display:block; height:100%; background:var(--v-gold); }
  .selo { position:absolute; top:10px; left:10px; z-index:3; font:700 .64rem/1 var(--v-sans); letter-spacing:.12em; text-transform:uppercase;
          padding:5px 8px; border-radius:99px; background:rgba(11,13,17,.82); border:1px solid var(--v-line); color:var(--v-text); }
  .selo.novo { background:var(--v-gold); color:var(--v-on-gold); border-color:var(--v-gold); }
  .selo.andamento { color:var(--v-steel-t); border-color:rgba(91,123,166,.7); }
  .selo.concluido { color:var(--v-ok); border-color:rgba(63,191,127,.6); }
  .tile.lock { opacity:.55; }

  /* ---------- progresso / conquistas / stats */
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; padding:6px var(--pad) 0; }
  .stat { background:var(--v-surface); border:1px solid var(--v-line); border-radius:var(--v-r); padding:14px; }
  .stat b { display:block; font:700 1.6rem/1.2 var(--v-serif); font-variant-numeric:tabular-nums; }
  .stat small { color:var(--v-muted); }
  .stats.in { padding:0; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); }
  .conq { flex:0 0 clamp(210px, 19vw, 260px); background:var(--v-surface); border:1px solid var(--v-line); border-radius:var(--v-r); padding:16px;
          scroll-snap-align:start; display:flex; flex-direction:column; gap:6px; min-height:132px; }
  .conq .medal { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-size:1.2rem; background:var(--v-surface-2);
                 border:1px solid var(--v-line); color:var(--v-muted); }
  .conq.done { border-color:rgba(212,162,76,.55); background:linear-gradient(160deg, rgba(212,162,76,.12), var(--v-surface) 60%); }
  .conq.done .medal { background:var(--v-gold); color:var(--v-on-gold); border-color:var(--v-gold); }
  .conq b { font-family:var(--v-serif); letter-spacing:.02em; }
  .conq small { color:var(--v-muted); }
  .gbar { height:5px; border-radius:99px; background:var(--v-surface-2); overflow:hidden; margin-top:auto; }
  .gbar i { border-radius:99px; }
  .block { padding:0 var(--pad); }

  /* ---------- modal */
  .modal-back { position:fixed; inset:0; z-index:60; background:rgba(5,6,9,.74); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
                display:grid; place-items:center; padding:16px; overflow-y:auto; animation:fade .22s var(--v-ease) both; }
  .modal { width:min(640px,100%); max-height:calc(100vh - 32px); overflow-y:auto; background:var(--v-surface); border:1px solid var(--v-line);
           border-radius:var(--v-r-lg); box-shadow:var(--v-shadow); animation:rise .26s var(--v-ease) both; }
  .modal-head { position:relative; min-height:150px; display:flex; align-items:flex-end; padding:18px 22px; overflow:hidden; border-radius:var(--v-r-lg) var(--v-r-lg) 0 0; }
  .modal-head::after { content:""; position:absolute; inset:0; background:linear-gradient(0deg, var(--v-surface) 0%, transparent 70%); }
  .modal-head > div.t { position:relative; z-index:2; }
  .modal-head h2 { font-size:1.55rem; margin-top:6px; }
  .modal-x { position:absolute; top:10px; right:10px; z-index:3; width:44px; height:44px; border-radius:50%; border:1px solid var(--v-line);
             background:rgba(11,13,17,.72); font-size:1.2rem; line-height:1; }
  .modal-body { padding:6px 22px 24px; }
  .modal-body p { margin:0 0 12px; }
  .levels { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; margin-top:14px; }
  .lvbtn { border:1px solid var(--v-line); background:var(--v-surface-2); border-radius:var(--v-r); padding:12px 14px; text-align:left; min-height:60px;
           transition:border-color .2s var(--v-ease), transform .2s var(--v-ease); }
  .lvbtn:hover:not(:disabled) { border-color:var(--v-gold); transform:translateY(-2px); }
  .lvbtn b { display:block; } .lvbtn small { color:var(--v-muted); font-size:.78rem; }
  .lvbtn:disabled { opacity:.5; cursor:not-allowed; }
  .recent { display:flex; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--v-line); font-size:.9rem; }
  .xpgain { font:700 1.5rem/1.2 var(--v-serif); color:var(--v-gold-2); font-variant-numeric:tabular-nums; }
  @keyframes fade { from { opacity:0; } }
  @keyframes rise { from { transform:translateY(14px); opacity:0; } }

  /* ---------- prova imersiva */
  .exam { max-width:900px; margin:0 auto; padding:22px var(--pad) 130px; }
  .examhead { display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .examhead .tt { font-family:var(--v-serif); font-weight:700; font-size:1.05rem; }
  .timer { font-family:var(--mono); font-weight:700; font-size:1.2rem; padding:6px 14px; border-radius:8px; background:var(--v-surface);
           border:1px solid var(--v-line); font-variant-numeric:tabular-nums; }
  .timer.warn { color:var(--v-bad-t); border-color:var(--v-bad); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.6; } }
  .gprog { height:6px; background:var(--v-surface-2); border-radius:99px; overflow:hidden; }
  .gprog i { display:block; height:100%; background:linear-gradient(90deg, var(--v-gold), var(--v-gold-2)); border-radius:99px; transition:width .35s var(--v-ease); }
  .dots { display:flex; gap:6px; margin:14px 0 22px; overflow-x:auto; padding:4px 2px 8px; scrollbar-width:thin; }
  .dot { flex:none; min-width:36px; height:36px; border-radius:8px; border:1px solid var(--v-line); background:var(--v-surface);
         font-size:.78rem; font-weight:700; color:var(--v-muted); font-variant-numeric:tabular-nums; }
  .dot.ans { background:rgba(212,162,76,.16); color:var(--v-gold-2); border-color:rgba(212,162,76,.5); }
  .dot[aria-current="step"] { background:var(--v-gold); color:var(--v-on-gold); border-color:var(--v-gold); }
  .qcard { background:var(--v-surface); border:1px solid var(--v-line); border-radius:var(--v-r-lg); padding:clamp(18px,3vw,34px); box-shadow:var(--v-shadow);
           animation:rise .3s var(--v-ease) both; }
  .qcard.still { animation:none; }
  .qmeta { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .enun { font-family:var(--v-serif); font-size:clamp(1.15rem,2.1vw,1.5rem); line-height:1.65; color:var(--v-text); margin:0 0 24px; max-width:68ch; outline:none; }
  .alts, .ce { display:grid; gap:10px; }
  .ce { grid-template-columns:1fr 1fr; }
  .alt { display:flex; gap:14px; align-items:flex-start; text-align:left; padding:14px 16px; min-height:56px; border-radius:var(--v-r);
         border:1.5px solid var(--v-line); background:var(--v-surface-2); transition:border-color .18s var(--v-ease), transform .18s var(--v-ease), background .18s; font-size:1.02rem; }
  .alt:hover { border-color:var(--v-gold); transform:translateY(-2px); }
  .alt .k { flex:none; min-width:34px; height:34px; border-radius:8px; display:grid; place-items:center; font-weight:700; background:var(--v-bg-2);
            border:1px solid var(--v-line); font-variant-numeric:tabular-nums; gap:0; }
  .alt .k small { display:none; }
  .alt[aria-pressed="true"] { border-color:var(--v-gold); background:rgba(212,162,76,.12); box-shadow:inset 3px 0 0 var(--v-gold); }
  .alt[aria-pressed="true"] .k { background:var(--v-gold); color:var(--v-on-gold); border-color:var(--v-gold); }
  .alt.ce { align-items:center; justify-content:center; font-weight:700; font-size:1.15rem; min-height:76px; }
  .hint { font-size:.82rem; color:var(--v-muted); margin-top:18px; }
  .examnav { position:fixed; left:0; right:0; bottom:0; z-index:20; background:rgba(11,13,17,.86); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
             border-top:1px solid var(--v-line); padding:10px var(--pad); }
  .examnav .row { max-width:900px; margin:0 auto; flex-wrap:nowrap; }
  .examnav .btn { padding:0 16px; }

  /* ---------- resultado e correção */
  .verdict { display:grid; grid-template-columns:auto 1fr; gap:28px; align-items:center; background:var(--v-surface); border:1px solid var(--v-line);
             border-radius:var(--v-r-lg); padding:clamp(18px,3vw,32px); }
  .ring { width:150px; height:150px; border-radius:50%; display:grid; place-items:center; position:relative;
          background:conic-gradient(var(--ring-color, var(--v-gold)) calc(var(--p, 0) * 1%), var(--v-surface-2) 0); }
  .ring::after { content:""; position:absolute; inset:12px; border-radius:50%; background:var(--v-surface); }
  .ring span { position:relative; z-index:1; font:700 1.9rem/1 var(--v-serif); font-variant-numeric:tabular-nums; }
  .stamp { display:inline-block; font-weight:800; letter-spacing:.14em; text-transform:uppercase; padding:6px 14px; border:3px solid currentColor;
           border-radius:8px; transform:rotate(-4deg); font-size:1.1rem; animation:stamp .45s var(--v-ease) both; }
  .stamp.ok { color:var(--v-ok); } .stamp.no { color:var(--v-bad-t); } .stamp.mid { color:var(--v-warn); }
  @keyframes stamp { from { transform:rotate(-4deg) scale(1.8); opacity:0; } to { transform:rotate(-4deg) scale(1); opacity:1; } }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--v-gold); color:var(--v-on-gold);
           padding:12px 18px; border-radius:10px; font-weight:700; z-index:80; box-shadow:var(--v-shadow); animation:rise .4s var(--v-ease) both; max-width:calc(100% - 32px); text-align:center; }
  .panel { background:var(--v-surface); border:1px solid var(--v-line); border-radius:var(--v-r); padding:18px; min-width:0; }
  .panel h2 { font-size:1.15rem; margin-bottom:10px; }

    el("span", {class:"chip steel", textContent:`${ROLE[sc.caso.papel].ic} ${sc.caso.papel_nome}`}),
    el("span", {class:"chip gold", textContent:`Cena ${sc.etapa} de ${sc.etapas}`}), el("span", {class:"spacer"}),
    el("button", {class:"btn ghost", onclick:viewCasos, textContent:"Sair do caso"}));
  const choices = el("div", {class:"choices", role:"group", "aria-label":"Escolhas"}, ...sc.escolhas.map(c => {
    const isPick = picked === c.indice;
    return el("button", {class:"choice" + (isPick ? " picked " + (verdict || "") : ""), disabled:picked !== null, "aria-pressed":isPick ? "true" : "false", onclick:() => choose(sc, c.indice)},
      el("span", {class:"k", textContent:c.indice + 1}),
      el("span", {class:"ctext"}, c.texto, isPick && verdict && el("span", {class:"mark", textContent:verdict === "ok" ? "✓ Boa jogada" : "✗ Arriscada"})));
  }));
  show(el("div", {class:"wrap"}, head,
    el("div", {class:"gprog", role:"progressbar", "aria-label":"Progresso do caso", "aria-valuemin":1, "aria-valuemax":sc.etapas, "aria-valuenow":sc.etapa, style:{marginBottom:"14px"}},
      el("i", {style:{width:(100 * sc.etapa / sc.etapas) + "%"}})),
    el("h1", {style:{fontSize:"clamp(1.5rem,3vw,2.2rem)"}, textContent:sc.caso.titulo}),
    el("div", {class:"meters"}, meter("Argumento", sc.medidores.argumento), meter("Credibilidade", sc.medidores.credibilidade)),
    el("div", {class:"scene"},
      el("div", {class:"case-art"}, art(sc.caso.titulo + sc.etapa, "⚖", true), el("div", {class:"loc", textContent:sc.local})),
      el("div", {class:"scene-in"},
        el("div", {class:"bubbles" + (picked !== null ? " still" : "")}, ...sc.falas.map(f => f.quem
          ? el("div", {class:"bubble"}, el("div", {class:"avatar", "aria-hidden":"true", style:{"--av":COR[f.cor] || "var(--v-text)"}, textContent:initials(f.quem)}),
              el("div", {}, el("div", {class:"who"}, el("b", {textContent:f.quem}), " ", el("small", {textContent:f.cargo})), el("div", {class:"say", textContent:f.texto})))
          : el("div", {class:"bubble narr"}, el("div", {class:"say", textContent:f.texto})))),
        el("div", {class:"question", id:"pergunta", tabindex:"-1", textContent:sc.pergunta}), choices,
        picked === null && el("div", {class:"hint"}, "Atalhos: ", ...sc.escolhas.flatMap((c, i) => [el("kbd", {textContent:String(i + 1)}), " "]), "escolher"),
        el("div", {id:"fb", "aria-live":"polite"})))));
  if (picked === null) $("#pergunta").focus({preventScroll:true});
}
async function choose(sc, idx) {
  if (!caso || caso.sessao !== sc.sessao || caso._busy) return;
  caso._busy = true;
  try {
    const r = await api("/api/arena/caso/escolher", {sessao:sc.sessao, indice:idx});
    const total = (r.efeito.argumento || 0) + (r.efeito.credibilidade || 0);
    const verdict = r.melhor_escolha || total > 0 ? "ok" : total < 0 ? "bad" : "";
    renderScene({...sc, medidores:r.medidores}, idx, verdict);
    const eff = (n, label) => el("span", {class:"eff " + (n > 0 ? "pos" : n < 0 ? "neg" : "zero"), textContent:`${n > 0 ? "+" : ""}${n} ${label}`});
    const go = r.final ? () => { continuar = null; renderFinal(r); }
                       : () => { continuar = null; caso = r.proxima; renderScene(r.proxima, null); };
    const next = el("button", {class:"btn primary", onclick:go, textContent:r.final ? "Ver o desfecho →" : "Continuar →"});
    $("#fb").replaceChildren(el("div", {class:"feedback " + verdict},
      el("div", {class:"row"}, eff(r.efeito.argumento, "Argumento"), eff(r.efeito.credibilidade, "Credibilidade"), r.melhor_escolha && el("span", {class:"best", textContent:"★ Melhor jogada"})),
      el("p", {style:{margin:"12px 0"}, textContent:r.feedback}),
      ...r.fundamentos.map(lawBox),
      el("div", {class:"row", style:{marginTop:"14px"}}, el("span", {class:"spacer"}), next)));
    next.scrollIntoView({block:"nearest", behavior:"smooth"});
    next.focus({preventScroll:true});
    continuar = go;  // Enter/Espaço avançam mesmo se o botão perder o foco
    caso = r.final ? null : {...caso, _busy:false, _next:r.proxima};
  } catch (e) { toast(e.message); if (caso) caso._busy = false; }
}
function renderFinal(r) {
  const f = r.final;
  const cls = {otimo:"ok", medio:"mid", ruim:"no"}[f.faixa] || "mid";
  show(el("div", {class:"wrap"}, el("div", {class:"scene final"},
    el("div", {class:"case-art"}, art(f.titulo, "⚖", true), el("div", {class:"loc", textContent:"Desfecho"})),
    el("div", {class:"fin-in"},
      el("div", {class:"stamp " + cls, textContent:f.carimbo}),
      el("h1", {textContent:f.titulo}),
      el("p", {textContent:f.texto}),
      el("div", {class:"row", style:{justifyContent:"center"}},
        el("span", {class:"chip", textContent:`Argumento ${f.argumento > 0 ? "+" : ""}${f.argumento}`}),
        el("span", {class:"chip", textContent:`Credibilidade ${f.credibilidade > 0 ? "+" : ""}${f.credibilidade}`}),
        el("span", {class:"chip gold", textContent:`Aproveitamento ${pct(f.aproveitamento)}`})),
      el("div", {class:"xpgain", style:{margin:"16px 0"}, textContent:`+${fmt(f.xp)} XP`}),
      el("div", {class:"row", style:{justifyContent:"center"}},
        el("button", {class:"btn primary", onclick:viewCasos, textContent:"Outros casos"}),
        el("button", {class:"btn", onclick:viewInicio, textContent:"Início"}))))));
  celebrate(r.progresso, f.xp);
}

// ---------------------------------------------------------------- teclado e navegação
document.addEventListener("keydown", (ev) => {
  if (modal) { if (ev.key === "Escape") { ev.preventDefault(); closeModal(); } return; }
  if (ev.ctrlKey || ev.metaKey || ev.altKey || /input|textarea/i.test(ev.target.tagName)) return;
  const k = ev.key.toUpperCase();
  if (prova) {
    const q = prova.s.questoes[prova.i];
    const keys = q.formato === "certo_errado" ? ["C", "E"] : Object.keys(q.alternativas);
    if (/^[1-9]$/.test(ev.key)) { if (keys[Number(ev.key) - 1]) answer(q.id, keys[Number(ev.key) - 1]); }
    else if (q.formato === "certo_errado" && (k === "C" || k === "E")) answer(q.id, k);
    else if (q.formato === "multipla" && q.alternativas[k]) answer(q.id, k);
    else if (ev.key === "ArrowRight" && prova.i < prova.s.questoes.length - 1) { prova.i++; renderQuestion({focus:"q"}); }
    else if (ev.key === "ArrowLeft" && prova.i > 0) { prova.i--; renderQuestion({focus:"q"}); }
    return;
  }
  if (continuar && (ev.key === "Enter" || ev.key === " ")) {
    const t = ev.target;
    if (t === document.body || t.id === "view" || t.id === "pergunta" || (t.classList && (t.classList.contains("choice") || t.textContent.includes("→")))) { ev.preventDefault(); continuar(); }
    return;
  }
  if (caso && !caso._busy && !caso._next && /^[1-9]$/.test(ev.key)) {
    const opt = caso.escolhas && caso.escolhas[Number(ev.key) - 1];
    if (opt) choose(caso, opt.indice);
  }
});
const routes = {inicio:viewInicio, simulados:viewSimulados, casos:viewCasos};
let lastHash = location.hash.slice(1);
async function navigate(tab) {
  if (prova && !(await ask("Sair do simulado em andamento?", "Sair", "Sair do simulado"))) {
    history.replaceState(null, "", "#" + lastHash); return false;
  }
  lastHash = tab;
  prova = null; caso = null; continuar = null; clearInterval(timerId);
  (routes[tab] || viewInicio)().catch(e => toast(e.message));
  return true;
}
document.querySelectorAll("nav.tabs [data-tab]").forEach(b => b.addEventListener("click", () => {
  if (location.hash.slice(1) === b.dataset.tab) navigate(b.dataset.tab);
  else location.hash = b.dataset.tab;  // dispara hashchange → navigate
}));
$("#profile").addEventListener("click", openProfile);
window.addEventListener("hashchange", () => navigate(location.hash.slice(1)));
loadProfile().catch(() => {});  // HUD (nível, XP, sequência) em qualquer aba de entrada
(routes[location.hash.slice(1)] || viewInicio)().catch(e => show(el("div", {class:"wrap"}, el("div", {class:"empty", textContent:"Não consegui falar com o servidor: " + e.message}))));
</script>
